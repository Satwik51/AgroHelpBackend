version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrohelp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrohelp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrohelp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrohelp-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrohelp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrohelp_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - agrohelp-network

volumes:
  postgres_data:
    driver: local

networks:
  agrohelp-network:
    driver: bridge
